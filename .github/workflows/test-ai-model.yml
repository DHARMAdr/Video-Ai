name: Test AI model
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Which model"
        type: choice
        options: [qwen3.5-9b, qwen3.5-4b, tiny]
        default: qwen3.5-9b
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print picture-reader file facts
        run: |
          python3 - <<'PY'
          import json, urllib.request
          for size, rev in [("9B","3885219b6810b007914f3a7950a8d1b469d598a5"),("4B","e87f176479d0855a907a41277aca2f8ee7a09523"),("0.8B","6ab461498e2023f6e3c1baea90a8f0fe38ab64d0")]:
              url = f"https://huggingface.co/api/models/unsloth/Qwen3.5-{size}-GGUF/tree/{rev}"
              for f in json.load(urllib.request.urlopen(url, timeout=60)):
                  if "mmproj" in f["path"]:
                      print("MMPROJ", size, rev, f["path"], f["size"], f.get("lfs",{}).get("oid"))
          PY
